<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Calculadora Pro</title>
    <style>
        /* Un diseño rápido, limpio y moderno */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .calc-container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; }
        h2, h3 { text-align: center; color: #333; margin-top: 0; }
        .section { border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .resultado { font-size: 18px; font-weight: bold; text-align: center; color: #28a745; margin-top: 10px; min-height: 24px; }
    </style>
</head>
<body>

<div class="calc-container">
    <h2>🧮 Multi-Calculadora</h2>

    <div class="section">
        <h3>Operaciones Básicas</h3>
        <input type="number" id="num1" placeholder="Primer número">
        <select id="operacion">
            <option value="suma">Sumar (+)</option>
            <option value="resta">Restar (-)</option>
            <option value="multiplicar">Multiplicar (×)</option>
            <option value="dividir">Dividir (÷)</option>
        </select>
        <input type="number" id="num2" placeholder="Segundo número">
        <button onclick="ejecutarOperacion()">Calcular</button>
        <div class="resultado" id="res-mates"></div>
    </div>

    <div class="section">
        <h3>Conversor de Divisas</h3>
        <input type="number" id="monto" placeholder="Monto a convertir" value="1">
        
        <label>De:</label>
        <select id="de-divisa">
            <option value="USD">USD - Dólar EE.UU.</option>
            <option value="COP" selected>COP - Peso Colombiano</option>
            <option value="MXN">MXN - Peso Mexicano</option>
            <option value="GBP">GBP - Libra Esterlina</option>
            <option value="INR">INR - Rupia India</option>
            <option value="TRY">TRY - Lira Turca</option>
            <option value="CNY">CNY - Yuan Chino</option>
            <option value="JPY">JPY - Yen Japonés</option>
            <option value="KRW">KRW - Won Surcoreano</option>
        </select>

        <label>A:</label>
        <select id="a-divisa">
            <option value="USD" selected>USD - Dólar EE.UU.</option>
            <option value="COP">COP - Peso Colombiano</option>
            <option value="MXN">MXN - Peso Mexicano</option>
            <option value="GBP">GBP - Libra Esterlina</option>
            <option value="INR">INR - Rupia India</option>
            <option value="TRY">TRY - Lira Turca</option>
            <option value="CNY">CNY - Yuan Chino</option>
            <option value="JPY">JPY - Yen Japonés</option>
            <option value="KRW">KRW - Won Surcoreano</option>
        </select>

        <button onclick="ejecutarConversion()">Convertir Moneda</button>
        <div class="resultado" id="res-divisas"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
