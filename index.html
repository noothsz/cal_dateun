<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Multi-Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">
    <nav class="sidebar">
        <h2>📊 Panel</h2>
        <button class="btn-menu activa" onclick="mostrarSeccion('seccion-mates', this)">🧮 Calculadora</button>
        <button class="btn-menu" onclick="mostrarSeccion('seccion-divisas', this)">💱 Divisas Dinámicas</button>
        <button class="btn-menu" onclick="mostrarSeccion('seccion-analisis', this)">📈 Análisis Mercado</button>
    </nav>

    <main class="contenido">
        
        <section id="seccion-mates" class="seccion visible">
            <h3>Operaciones Básicas</h3>
            <div class="tarjeta">
                <input type="number" id="num1" placeholder="Primer número">
                <select id="operacion">
                    <option value="suma">Sumar (+)</option>
                    <option value="resta">Restar (-)</option>
                    <option value="multiplicar">Multiplicar (×)</option>
                    <option value="dividir">Dividir (÷)</option>
                </select>
                <input type="number" id="num2" placeholder="Segundo número">
                <button class="btn-accion" onclick="ejecutarOperacion()">Calcular</button>
                <div class="resultado" id="res-mates"></div>
            </div>
        </section>

        <section id="seccion-divisas" class="seccion">
            <h3>Conversor Múltiple Automatizado</h3>
            <p class="instruccion">Escribe un monto en cualquier divisa y el resto se calculará al instante.</p>
            <div class="tarjeta">
                <div id="contenedor-matriz-divisas"></div>
                
                <button class="btn-accion btn-agregar" onclick="agregarFilaDivisa()">+ Añadir otra divisa</button>
            </div>
        </section>

        <section id="seccion-analisis" class="seccion">
            <h3>Comparador y Análisis</h3>
            <div class="tarjeta">
                <label>Selecciona dos divisas para analizar su comportamiento:</label>
                <div class="fila-analisis">
                    <select id="analisis-moneda-1">
                        <option value="USD">USD - Dólar</option>
                        <option value="COP">COP - Peso Colombiano</option>
                        <option value="MXN">MXN - Peso Mexicano</option>
                        <option value="EUR">EUR - Euro</option>
                    </select>
                    <select id="analisis-moneda-2">
                        <option value="TRY">TRY - Lira Turca</option>
                        <option value="JPY">JPY - Yen Japonés</option>
                        <option value="GBP">GBP - Libra Esterlina</option>
                        <option value="CNY">CNY - Yuan Chino</option>
                    </select>
                </div>
                <button class="btn-accion" onclick="mostrarAnalisisMercado()">Generar Análisis</button>
                <div class="resultado analisis-texto" id="texto-analisis"></div>
            </div>
        </section>

    </main>
</div>

<script src="script.js"></script>
</body>
</html>
